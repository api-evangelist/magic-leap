aid: magic-leap
name: Magic Leap
description: >-
  Magic Leap is an augmented reality company headquartered in Plantation,
  Florida, building see-through AR optics (waveguides and display systems) and
  the Magic Leap 2 enterprise AR headset, along with a developer platform for
  spatial computing. Developers build on-device applications using the Magic
  Leap Unity SDK, an OpenXR runtime, and a native C API, distributed through the
  Magic Leap Hub package registry and the company's GitHub organization. Magic
  Leap does not publish a public hosted REST API or OpenAPI specification; its
  integration surface is the device SDK. The company holds ISO/IEC 27001:2022
  and SOC 2 Type II attestations. It was added to the API Evangelist network as
  a VC-portfolio lead (a16z, Kleiner Perkins, Obvious Ventures).
